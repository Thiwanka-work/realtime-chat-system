<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register – SecureChat</title>
  <meta name="description" content="Create your SecureChat account and start chatting in real-time." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-header">
        <div class="logo">💬</div>
        <h1>SecureChat</h1>
        <p>Create your account</p>
      </div>

      <div id="alert-box" class="alert hidden"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Choose a username (3–50 chars)"
            autocomplete="username"
            required
            minlength="3"
            maxlength="50"
          />
          <span class="field-error" id="username-error"></span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          />
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="At least 6 characters"
              autocomplete="new-password"
              required
              minlength="6"
            />
            <button type="button" class="toggle-pwd" id="toggle-pwd" aria-label="Toggle password visibility">👁</button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>

        <button type="submit" class="btn-primary" id="register-btn">
          <span class="btn-text">Create Account</span>
          <span class="btn-spinner hidden">⏳</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="/index.html">Sign in</a></p>
      </div>

    </div>
  </div>

  <script src="/js/auth.js"></script>
</body>
</html>
